apiVersion: v1
kind: Service
metadata:
  name: ase-guard-pulse-service
spec:
  # Bulut ortamları için LoadBalancer kullanın. Minikube gibi lokal cluster'lar için
  # bu alanı NodePort olarak değiştirebilir veya bir Ingress kullanabilirsiniz.
  type: LoadBalancer
  selector:
    app: ase-guard-pulse
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
